[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalsense-ai"
version = "0.1.0"
description = "Canine Piezo + BMI270 vital-sign analytics research pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.scripts]
vitalsense = "vitalsense.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

