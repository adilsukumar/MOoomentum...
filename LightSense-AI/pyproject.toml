[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightsense-led-backend"
version = "0.1.0"
description = "Backend and device protocol for two WS2812B installations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "paho-mqtt>=2.1,<3",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

